    <noscript>
      <header>
        <h1>Emberoo — Free 2D Side-Scrolling Adventure Platformer</h1>
        <p>Emberoo is a vibrant browser-based platform adventure across three fiery realms. Leap over blazing pits, dodge rising flame pillars, and run to reunite with your companion.</p>
      </header>
      <main>
        <h2>Game Features & Levels</h2>
        <ul>
          <li><strong>World 1: Sunny Grasslands</strong> — Gentle rolling hills and brick obstacles.</li>
          <li><strong>World 2: Copper Dune Run</strong> — Moving floating platforms and floating obstacles.</li>
          <li><strong>World 3: Emberpeak Pass</strong> — Rising magma pillars and intense hazards.</li>
        </ul>
        <h2>Controls</h2>
        <p>Keyboard: Arrow keys or A/D to run, Spacebar / W / Up Arrow to jump, ESC to pause. Touchscreens: on-screen tactile D-Pad and Jump button.</p>
        <section>
          <h2>Frequently Asked Questions</h2>
          <article>
            <h3>What is Emberoo?</h3>
            <p>Emberoo is a free, web-based 2D side-scrolling platform adventure game built with React, TypeScript, and HTML5 Canvas. Players leap through three progressive fiery worlds—Sunny Grasslands, Copper Dune Run, and Emberpeak Pass—dodging rising magma pillars and moving obstacles to reach the goal.</p>
          </article>
          <article>
            <h3>How do you customize characters and share levels with friends?</h3>
            <p>Emberoo features an integrated Character Studio where players can upload or paste custom character images, design companions, and assign custom audio effects. Once configured, players generate an instant compressed share link that allows friends to play the exact customized adventure without logging in.</p>
          </article>
          <article>
            <h3>What devices and controls are supported?</h3>
            <p>Emberoo is fully responsive and optimized for PC, Mac, Chromebook, iPhone, iPad, and Android devices. It supports keyboard controls (WASD, Arrow keys, Spacebar, ESC) on desktop, as well as an ergonomic on-screen multi-touch D-Pad and Jump button on touchscreens.</p>
          </article>
        </section>
        <p><em>Please enable JavaScript in your browser settings to play Emberoo.</em></p>
